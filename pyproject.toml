[project]
name = "title-ix-deep-research"
version = "0.1.0"
description = "Deep research on gender equity in college athletics: a Lead fans out Data, News and Policy researchers over EADA data, curated NIL figures and live news; a Writer turns verified findings into a cited report"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "openai-agents[litellm]>=0.22",
    "google-cloud-aiplatform>=1.40.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "duckdb>=1.1",
    "pandas>=2.2",          # build_eada.py: reading .xlsx files
    "openpyxl>=3.1",
    "trafilatura>=1.12",    # web.py: article text + publication date extraction
]
